<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>T-Shirt Compositor</title>
<style>
@font-face { font-family: 'IMFell'; src: url('../merch/fonts/IMFellEnglish-Regular.ttf'); }
@font-face { font-family: 'IMFellI'; src: url('../merch/fonts/IMFellEnglish-Italic.ttf'); font-style:italic; }
@font-face { font-family: 'Fraunces'; src: url('../../gather/assets/fonts/Fraunces-Black.ttf'); font-weight:900; }

*{box-sizing:border-box;margin:0;padding:0;}
body{background:#0e0c0a;color:#f0ede8;font-family:system-ui,sans-serif;display:flex;gap:0;min-height:100vh;}

/* ── Preview ── */
#preview-wrap{position:relative;width:520px;min-width:520px;height:100vh;display:flex;align-items:center;justify-content:center;background:#080604;}
#shirt-canvas{position:relative;width:440px;height:490px;}
#shirt-svg{position:absolute;inset:0;width:100%;height:100%;}
#shirt-content{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;}
#design-img{display:block;object-fit:contain;}
#shirt-text{text-align:center;width:100%;padding:0 12%;}
.shirt-line{display:block;}
#shirt-title .shirt-line{font-family:'Fraunces',Georgia,serif;font-weight:900;text-transform:uppercase;white-space:nowrap;}
.shirt-rule{height:1px;background:rgba(202,138,4,0.4);margin:6px auto;}
#shirt-sub .shirt-line{font-family:'IMFellI',Georgia,serif;font-style:italic;}
#shirt-det .shirt-line{font-family:'IMFell',Georgia,serif;}

/* ── Controls ── */
#controls{flex:1;padding:28px 24px;overflow-y:auto;background:#0f0d0b;border-left:1px solid rgba(255,255,255,0.06);}
h2{font-size:13px;letter-spacing:0.2em;text-transform:uppercase;color:rgba(255,255,255,0.3);margin-bottom:16px;}
.group{margin-bottom:22px;}
.group label{display:block;font-size:11px;color:rgba(255,255,255,0.4);margin-bottom:6px;letter-spacing:0.05em;}
.group input[type=range]{width:100%;accent-color:#ca8a04;}
.group input[type=text],.group input[type=color]{width:100%;background:#1a1714;border:1px solid rgba(255,255,255,0.1);border-radius:4px;color:#f0ede8;padding:7px 10px;font-size:13px;}
.group textarea{width:100%;background:#1a1714;border:1px solid rgba(255,255,255,0.1);border-radius:4px;color:#f0ede8;padding:7px 10px;font-size:13px;resize:vertical;min-height:54px;line-height:1.5;font-family:system-ui,sans-serif;}
.group input[type=color]{height:36px;padding:2px 6px;cursor:pointer;}
.val{float:right;font-size:11px;color:rgba(255,255,255,0.4);}
.btn{display:block;width:100%;margin-top:8px;background:#1a3a1e;color:#4a9a6a;border:1px solid #1a3a1e;border-radius:6px;padding:10px;font-size:12px;letter-spacing:0.05em;cursor:pointer;text-align:center;}
.btn:hover{background:#1f4522;}
.btn.gold{background:#ca8a04;color:#0e0c0a;border-color:#ca8a04;font-weight:700;}
hr{border:none;border-top:1px solid rgba(255,255,255,0.06);margin:20px 0;}

/* blank selector */
.blanks{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;}
.blank-opt{width:48px;height:48px;border-radius:6px;cursor:pointer;border:2px solid transparent;object-fit:cover;}
.blank-opt.active{border-color:#ca8a04;}

/* image chooser */
#chooser-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px;max-height:260px;overflow-y:auto;}
.img-opt{width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px;cursor:pointer;border:2px solid transparent;background:#111;}
.img-opt:hover{border-color:#ca8a04aa;}
.img-opt.active{border-color:#ca8a04;}
.img-opt-placeholder{width:100%;aspect-ratio:1;border-radius:6px;background:#1a1714;border:2px dashed rgba(255,255,255,0.1);display:flex;align-items:center;justify-content:center;font-size:8px;color:rgba(255,255,255,0.2);cursor:pointer;text-align:center;padding:4px;}
.chooser-hint{font-size:10px;color:rgba(255,255,255,0.25);margin-top:6px;}
</style>
</head>
<body>

<!-- Preview -->
<div id="preview-wrap">
  <div id="shirt-canvas">
    <svg id="shirt-svg" viewBox="0 0 440 490" xmlns="http://www.w3.org/2000/svg">
      <path id="shirt-path" d="M135 19 C163 19 188 38 220 38 C252 38 277 19 305 19 L352 50 L420 82 L415 176 L352 163 L352 459 L88 459 L88 163 L25 176 L20 82 L88 50 Z" fill="#141210"/>
      <path d="M179 26 Q220 69 261 26 Q238 19 220 38 Q202 19 179 26 Z" fill="#1a1815"/>
      <line x1="88" y1="163" x2="352" y2="163" stroke="#1e1c1a" stroke-width="1"/>
      <line x1="88" y1="455" x2="352" y2="455" stroke="#1e1c1a" stroke-width="1"/>
    </svg>
    <div id="shirt-content">
      <img id="design-img" src="">
      <div id="shirt-text">
        <div id="shirt-title"></div>
        <div class="shirt-rule" id="rule" style="width:80px;"></div>
        <div id="shirt-sub"></div>
        <div id="shirt-det"></div>
      </div>
    </div>
  </div>
</div>

<!-- Controls -->
<div id="controls">
  <h2>T-Shirt Compositor</h2>

  <!-- Blank color -->
  <div class="group">
    <label>Blank shirt</label>
    <div class="blanks">
      <img class="blank-opt active" src="../public/merch/blanks/blank-black.webp" data-color="#141210" title="Black" onclick="setBlank(this,'#141210')">
      <img class="blank-opt" src="../public/merch/blanks/blank-cream.webp" data-color="#f0ebe0" title="Cream" onclick="setBlank(this,'#f0ebe0')">
      <img class="blank-opt" src="../public/merch/blanks/blank-forest.webp" data-color="#1a3a1e" title="Forest" onclick="setBlank(this,'#1a3a1e')">
      <img class="blank-opt" src="../public/merch/blanks/blank-navy.webp" data-color="#0e1a2e" title="Navy" onclick="setBlank(this,'#0e1a2e')">
      <img class="blank-opt" src="../public/merch/blanks/blank-olive.webp" data-color="#3a3820" title="Olive" onclick="setBlank(this,'#3a3820')">
    </div>
  </div>

  <!-- Design chooser -->
  <div class="group">
    <label>Design image — click to choose</label>
    <div id="chooser-grid"></div>
    <div class="chooser-hint">or drop an image / enter path below</div>
    <input type="text" id="img-path" placeholder="path/to/design.png" oninput="loadPath(this.value)" style="margin-top:8px;">
    <button class="btn" onclick="document.getElementById('img-file').click()">Upload image</button>
    <input type="file" id="img-file" accept="image/*" style="display:none" onchange="loadFile(this)">
  </div>

  <!-- Design size -->
  <div class="group">
    <label>Design size <span class="val" id="size-val">55%</span></label>
    <input type="range" id="img-size" min="10" max="90" value="55" oninput="updateLayout()">
  </div>

  <!-- Design vertical position -->
  <div class="group">
    <label>Design top offset <span class="val" id="top-val">22%</span></label>
    <input type="range" id="img-top" min="5" max="70" value="22" oninput="updateLayout()">
  </div>

  <hr>

  <!-- Title text — multiline -->
  <div class="group">
    <label>Title (Enter = new line)</label>
    <textarea id="title-text" oninput="updateText()">WE ARE ALL ON THE WAY.</textarea>
  </div>
  <div class="group">
    <label>Title size <span class="val" id="title-size-val">22px</span></label>
    <input type="range" id="title-size" min="8" max="48" value="22" oninput="updateText()">
  </div>
  <div class="group">
    <label>Title color</label>
    <input type="color" id="title-color" value="#c8a032" oninput="updateText()">
  </div>

  <!-- Sub text -->
  <div class="group">
    <label>Sub line (Enter = new line)</label>
    <textarea id="sub-text" oninput="updateText()">Ecclesia · A Fresh Expression</textarea>
  </div>
  <div class="group">
    <label>Detail line</label>
    <input type="text" id="det-text" value="ecclesiacommunity.org" oninput="updateText()">
  </div>
  <div class="group">
    <label>Sub/detail size <span class="val" id="sub-size-val">12px</span></label>
    <input type="range" id="sub-size" min="6" max="28" value="12" oninput="updateText()">
  </div>
  <div class="group">
    <label>Sub color</label>
    <input type="color" id="sub-color" value="#888070" oninput="updateText()">
  </div>

  <!-- Gap between design and text -->
  <div class="group">
    <label>Gap (design → text) <span class="val" id="gap-val">12px</span></label>
    <input type="range" id="gap" min="0" max="60" value="12" oninput="updateLayout()">
  </div>

  <hr>

  <button class="btn gold" onclick="saveImage()">↓ Save as PNG</button>
</div>

<script>
const designImg  = document.getElementById('design-img');
const shirtContent = document.getElementById('shirt-content');
const shirtPath  = document.getElementById('shirt-path');
const titleEl    = document.getElementById('shirt-title');
const subEl      = document.getElementById('shirt-sub');
const detEl      = document.getElementById('shirt-det');
const ruleEl     = document.getElementById('rule');
const shirtText  = document.getElementById('shirt-text');

// ── Image catalog ──────────────────────────────────────────
const IMAGES = [
  { label:'Bowl', src:'../../gather/apps/ecclesia-community/public/images/merch/ep-wound-is-the-way-bowl.png' },
  { label:'Mossy Coin', src:'../../gather/assets/ecclesia/ecclesia-coin-mossy-hero.png' },
  { label:'Coin nobg', src:'../../gather/assets/ecclesia/ecclesia-coin-nobg.png' },
  { label:'Coin 3D', src:'../../gather/assets/ecclesia/ecclesia-coin-3d-photoreal.png' },
  { label:'Coin 8bit', src:'../../gather/assets/ecclesia/ecclesia-coin-8bit-trans.png' },
  { label:'Coin 8bit v2', src:'../../gather/assets/ecclesia/ecclesia-coin-8bit-v2-trans.png' },
  { label:'Stone pixel', src:'../../gather/assets/ecclesia/ecclesia-stone-pixel.png' },
  { label:'Stone hero', src:'../../gather/assets/ecclesia/ecclesia-stone-hero-photoreal.png' },
  { label:'Bus woodcut', src:'../public/merch/freedom-riders/bus-woodcut.png' },
  { label:'Dennis', src:'../public/merch/freedom-riders/dennis-shirt-design.png' },
  { label:'Skull marigold', src:'../../gather/apps/ecclesia-community/public/images/merch/skull-marigold-sticker-trans.png' },
  { label:'Skull gothic', src:'../../gather/apps/ecclesia-community/public/images/merch/skull-gothic-sticker-trans.png' },
];

function buildChooser() {
  const grid = document.getElementById('chooser-grid');
  IMAGES.forEach(item => {
    const img = document.createElement('img');
    img.className = 'img-opt';
    img.src = item.src;
    img.title = item.label;
    img.onerror = () => { img.style.display='none'; };
    img.onclick = () => {
      document.querySelectorAll('.img-opt').forEach(i=>i.classList.remove('active'));
      img.classList.add('active');
      designImg.src = item.src;
      document.getElementById('img-path').value = item.src;
      updateLayout();
    };
    grid.appendChild(img);
  });
}
buildChooser();

// ── Helpers ────────────────────────────────────────────────
function v(id){ return document.getElementById(id).value; }
function vn(id){ return parseFloat(document.getElementById(id).value); }

function renderLines(el, text, lineHeight) {
  el.innerHTML = '';
  (text || '').split('\n').forEach(line => {
    if (!line.trim()) return;
    const span = document.createElement('span');
    span.className = 'shirt-line';
    span.textContent = line;
    span.style.lineHeight = lineHeight;
    el.appendChild(span);
  });
}

function setBlank(el, color) {
  document.querySelectorAll('.blank-opt').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  shirtPath.setAttribute('fill', color);
  document.querySelector('#shirt-svg path:nth-child(2)').setAttribute('fill',
    color === '#141210' ? '#1a1815' : color === '#f0ebe0' ? '#e8e2d4' : color);
}

function loadPath(p) {
  if (p) { designImg.src = p; updateLayout(); }
}

function loadFile(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => { designImg.src = e.target.result; updateLayout(); };
  reader.readAsDataURL(file);
}

function updateLayout() {
  const size = vn('img-size');
  const topPct = vn('img-top');
  const gap = vn('gap');

  document.getElementById('size-val').textContent = size + '%';
  document.getElementById('top-val').textContent = topPct + '%';
  document.getElementById('gap-val').textContent = gap + 'px';

  const canvasW = 440;
  const canvasH = 490;
  designImg.style.width = (canvasW * size / 100) + 'px';
  designImg.style.marginTop = (canvasH * topPct / 100) + 'px';
  shirtText.style.marginTop = gap + 'px';
}

function updateText() {
  const titleSize = vn('title-size');
  const subSize   = vn('sub-size');
  document.getElementById('title-size-val').textContent = titleSize + 'px';
  document.getElementById('sub-size-val').textContent = subSize + 'px';

  const titleColor = v('title-color');
  const subColor   = v('sub-color');

  // Title — multiline
  renderLines(titleEl, v('title-text'), '1.1');
  titleEl.style.fontSize = titleSize + 'px';
  titleEl.style.color = titleColor;
  titleEl.style.fontFamily = "'Fraunces', Georgia, serif";
  titleEl.style.fontWeight = '900';
  titleEl.style.textTransform = 'uppercase';

  // Sub — multiline
  renderLines(subEl, v('sub-text'), '1.3');
  subEl.style.fontSize = subSize + 'px';
  subEl.style.color = subColor;
  subEl.style.fontFamily = "'IMFellI', Georgia, serif";
  subEl.style.fontStyle = 'italic';
  subEl.style.marginTop = '5px';

  // Detail
  detEl.textContent = v('det-text');
  detEl.style.fontSize = (subSize - 2) + 'px';
  detEl.style.color = subColor;
  detEl.style.opacity = '0.6';
  detEl.style.marginTop = '4px';
  detEl.style.fontFamily = "'IMFell', Georgia, serif";
  detEl.style.display = 'block';

  ruleEl.style.width = Math.min(titleSize * 3, 120) + 'px';
  ruleEl.style.marginTop = '8px';
  ruleEl.style.marginBottom = '0';
}

function saveImage() {
  const h2c = window.html2canvas;
  if (!h2c) { alert('html2canvas still loading, wait a sec'); return; }
  h2c(document.getElementById('shirt-canvas'), {backgroundColor: null, scale: 2}).then(canvas => {
    const a = document.createElement('a');
    a.download = 'shirt-mockup.png';
    a.href = canvas.toDataURL('image/png');
    a.click();
  });
}

// Load html2canvas
const s = document.createElement('script');
s.src = 'https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js';
document.head.appendChild(s);

// Init
updateLayout();
updateText();
</script>
</body>
</html>
