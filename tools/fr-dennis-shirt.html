<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>David Dennis — Freedom Rider Shirt</title>
<style>
@font-face {
  font-family: 'IMFell';
  src: url('../merch/fonts/IMFellEnglish-Regular.ttf') format('truetype');
}
@font-face {
  font-family: 'IMFell';
  src: url('../merch/fonts/IMFellEnglish-Italic.ttf') format('truetype');
  font-style: italic;
}
@font-face {
  font-family: 'Fraunces';
  src: url('../../gather/assets/fonts/Fraunces-Black.ttf') format('truetype');
  font-weight: 900;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #0e0c0a;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 40px;
}

.shirt-wrap {
  position: relative;
  width: 700px;
  height: 780px;
}

.shirt-svg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}

.shirt-content {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding-top: 185px;
  gap: 0;
}

.design {
  width: 360px;
  mix-blend-mode: screen;
}

.shirt-text {
  margin-top: 16px;
  text-align: center;
}

.shirt-title {
  font-family: 'Fraunces', Georgia, serif;
  font-weight: 900;
  font-size: 26px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: #e8c87a;
}

.rule {
  width: 100px;
  height: 1px;
  background: rgba(202,138,4,0.4);
  margin: 8px auto 8px;
}

.shirt-sub {
  font-family: 'IMFell', Georgia, serif;
  font-style: italic;
  font-size: 14px;
  color: rgba(240,237,232,0.6);
  letter-spacing: 0.04em;
}

.shirt-detail {
  font-family: 'IMFell', Georgia, serif;
  font-size: 11px;
  color: rgba(240,237,232,0.32);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  margin-top: 4px;
}
</style>
</head>
<body>

<div class="shirt-wrap">

  <svg class="shirt-svg" viewBox="0 0 700 780" xmlns="http://www.w3.org/2000/svg">
    <path d="
      M 215 30
      C 260 30 300 60 350 60
      C 400 60 440 30 485 30
      L 560 80
      L 670 130
      L 660 280
      L 560 260
      L 560 730
      L 140 730
      L 140 260
      L 40 280
      L 30 130
      L 140 80
      Z
    " fill="#141210" />
    <path d="M 285 42 Q 350 110 415 42 Q 380 30 350 60 Q 320 30 285 42 Z" fill="#1a1815"/>
    <line x1="140" y1="260" x2="560" y2="260" stroke="#1e1c1a" stroke-width="1.5"/>
    <line x1="140" y1="725" x2="560" y2="725" stroke="#1e1c1a" stroke-width="1"/>
  </svg>

  <div class="shirt-content">
    <img class="design" src="../public/merch/freedom-riders/dennis-shirt-design.png" alt="David Dennis">
  </div>

</div>

</body>
</html>
