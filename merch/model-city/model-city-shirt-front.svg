<svg viewBox="0 0 4500 5400" xmlns="http://www.w3.org/2000/svg">
  <!-- Transparent background -->
  <rect width="4500" height="5400" fill="none"/>

  <!-- Eyebrow: "Anniston, Alabama — Est. 1872" -->
  <text
    x="2250"
    y="1200"
    font-family="Georgia, serif"
    font-size="200"
    fill="#1c1917"
    text-anchor="middle"
    font-style="italic"
    font-weight="300"
    letter-spacing="3">Anniston, Alabama — Est. 1872</text>

  <!-- Top decorative rule -->
  <line x1="1850" y1="1350" x2="3650" y2="1350" stroke="#1c1917" stroke-width="10" opacity="0.5"/>

  <!-- Headline: "The Model City" (stacked) -->
  <text
    x="2250"
    y="2000"
    font-family="Abril Fatface, serif"
    font-size="650"
    fill="#1c1917"
    text-anchor="middle"
    font-weight="400">The</text>

  <text
    x="2250"
    y="2750"
    font-family="Abril Fatface, serif"
    font-size="650"
    fill="#1c1917"
    text-anchor="middle"
    font-weight="400">Model</text>

  <text
    x="2250"
    y="3500"
    font-family="Abril Fatface, serif"
    font-size="650"
    fill="#1c1917"
    text-anchor="middle"
    font-weight="400">City</text>

  <!-- Bottom decorative rule -->
  <line x1="1850" y1="3800" x2="3650" y2="3800" stroke="#1c1917" stroke-width="10" opacity="0.5"/>

  <!-- Footer: "SOUTHERN LEGENDS" -->
  <text
    x="2250"
    y="4300"
    font-family="Georgia, serif"
    font-size="220"
    fill="#1c1917"
    text-anchor="middle"
    font-style="italic"
    font-weight="400"
    letter-spacing="8">SOUTHERN LEGENDS</text>
</svg>