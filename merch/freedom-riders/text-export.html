<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: transparent; padding: 40px; display: flex; flex-direction: column; gap: 40px; }

  .text-el {
    display: inline-block;
    background: transparent;
  }

  #quote {
    font-family: 'IM Fell English', serif;
    font-style: italic;
    font-size: 48px;
    color: #1c1917;
    line-height: 1.4;
    max-width: 700px;
  }

  #name {
    font-family: 'IM Fell English', serif;
    font-size: 64px;
    color: #1c1917;
    letter-spacing: 1px;
  }

  #name-small {
    font-family: 'IM Fell English', serif;
    font-size: 36px;
    color: #1c1917;
    letter-spacing: 1px;
  }

  #role {
    font-family: 'IM Fell English', serif;
    font-style: italic;
    font-size: 28px;
    color: #1c1917;
    letter-spacing: 2px;
  }

  #location {
    font-family: 'IM Fell English', serif;
    font-size: 22px;
    color: #1c1917;
    letter-spacing: 3px;
    text-transform: uppercase;
  }

  #booking {
    font-family: 'IM Fell English', serif;
    font-size: 22px;
    color: #1c1917;
    letter-spacing: 3px;
  }

  #sl-credit {
    font-family: 'IM Fell English', serif;
    font-style: italic;
    font-size: 20px;
    color: #1c1917;
    letter-spacing: 3px;
    text-transform: uppercase;
  }
</style>
</head>
<body>
  <span class="text-el" id="quote">"I was trying to get<br>a date with a woman."</span>
  <span class="text-el" id="name">David Dennis</span>
  <span class="text-el" id="name-small">David Dennis</span>
  <span class="text-el" id="role">Freedom Rider · 1961</span>
  <span class="text-el" id="location">Anniston, Alabama · May 14, 1961</span>
  <span class="text-el" id="booking">20883 · Jackson, Miss. · 1961</span>
  <span class="text-el" id="sl-credit">Southern Legends</span>
</body>
</html>
