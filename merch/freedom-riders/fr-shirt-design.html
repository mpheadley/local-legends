<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Freedom Riders — Shirt Design</title>
<style>
  @font-face {
    font-family: 'IMFell';
    src: url('../fonts/IMFellEnglish-Regular.ttf');
    font-weight: 400;
    font-style: normal;
  }
  @font-face {
    font-family: 'IMFell';
    src: url('../fonts/IMFellEnglish-Italic.ttf');
    font-weight: 400;
    font-style: italic;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #222;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    min-height: 100vh;
    padding: 40px 300px 60px 40px;
    gap: 24px;
    flex-wrap: wrap;
  }

  /* ── Design canvas ── */
  .shirt {
    width: 560px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 48px 40px 40px;
  }
  .shirt.black { background: #0f0f0f; }
  .shirt.cream { background: #f0ede8; }

  /* ── Image ── */
  .bus-wrap {
    width: 100%;
    margin-bottom: 24px;
  }
  .bus-wrap img {
    width: 100%;
    display: block;
  }

  /* ── Rule ── */
  .rule {
    width: 80%;
    height: 1px;
    margin-bottom: 18px;
  }
  .black .rule { background: rgba(255,255,255,0.18); }
  .cream .rule { background: rgba(0,0,0,0.2); }

  /* ── Type ── */
  .headline {
    font-family: 'IMFell', Georgia, serif;
    font-weight: 400;
    font-style: normal;
    font-size: 42px;
    letter-spacing: 0.06em;
    text-align: center;
    line-height: 1;
    margin-bottom: 10px;
  }
  .subline {
    font-family: 'IMFell', Georgia, serif;
    font-weight: 400;
    font-style: italic;
    font-size: 18px;
    letter-spacing: 0.04em;
    text-align: center;
    margin-bottom: 16px;
  }
  .credit {
    font-family: 'IMFell', Georgia, serif;
    font-weight: 400;
    font-style: normal;
    font-size: 11px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    text-align: center;
  }

  /* color variants */
  .black .headline, .black .subline { color: #f0ede8; }
  .black .subline                   { color: #ca8a04; }
  .black .credit                    { color: rgba(240,237,230,0.3); }

  .cream .headline, .cream .subline { color: #1a1a1a; }
  .cream .subline                   { color: #7a4800; }
  .cream .credit                    { color: rgba(0,0,0,0.3); }

  /* ── Edit panel ── */
  #ep {
    position: fixed;
    top: 0; right: 0;
    width: 260px;
    background: #0d0d0d;
    border-left: 1px solid #1f1f1f;
    padding: 16px;
    font-family: system-ui;
    font-size: 12px;
    color: #f0ede8;
    height: 100vh;
    overflow-y: auto;
    z-index: 100;
  }
  #ep h3 { font-size: 13px; font-weight: 700; margin-bottom: 14px; color: #ca8a04; letter-spacing: 0.05em; }
  #ep label { display: block; color: #666; font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 3px; margin-top: 12px; }
  #ep input[type=color]  { width: 100%; height: 32px; padding: 2px; background: #111; border: 1px solid #222; border-radius: 3px; cursor: pointer; }
  #ep input[type=text]   { width: 100%; padding: 5px 7px; background: #111; border: 1px solid #222; color: #f0ede8; font-size: 11px; border-radius: 3px; }
  #ep input[type=range]  { width: 100%; accent-color: #ca8a04; }
  .ep-btn {
    display: block; width: 100%; padding: 8px;
    background: #1f1f1f; color: #f0ede8; border: 1px solid #333;
    font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase;
    cursor: pointer; border-radius: 3px; margin-top: 10px;
  }
  .ep-btn:hover { background: #2a2a2a; }
  .ep-divider { border: none; border-top: 1px solid #1f1f1f; margin: 14px 0 2px; }

  /* ── Version toggle chips ── */
  .chips { display: flex; gap: 8px; margin-bottom: 14px; }
  .chip {
    padding: 5px 12px; border-radius: 99px; font-size: 10px;
    letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer;
    border: 1px solid #333; background: #111; color: #888;
  }
  .chip.active { background: #ca8a04; color: #0d0d0d; border-color: #ca8a04; font-weight: 700; }
</style>
</head>
<body>

<!-- Black version -->
<div class="shirt black" id="design-black">
  <div class="bus-wrap">
    <img id="img-black" src="bus-woodcut-inverted.png" alt="Freedom Riders bus — inverted">
  </div>
  <div class="rule"></div>
  <div class="headline" id="hl-black">Freedom Riders</div>
  <div class="subline" id="sub-black">Anniston, Alabama &middot; 1961</div>
  <div class="credit" id="cr-black">Southern Legends</div>
</div>

<!-- Cream version -->
<div class="shirt cream" id="design-cream">
  <div class="bus-wrap">
    <img id="img-cream" src="bus-woodcut.png" alt="Freedom Riders bus — original">
  </div>
  <div class="rule"></div>
  <div class="headline" id="hl-cream">Freedom Riders</div>
  <div class="subline" id="sub-cream">Anniston, Alabama &middot; 1961</div>
  <div class="credit" id="cr-cream">Southern Legends</div>
</div>

<!-- Edit panel -->
<div id="ep">
  <h3>Freedom Riders — Edit</h3>

  <div class="chips">
    <div class="chip active" onclick="showBoth()">Both</div>
    <div class="chip" onclick="showOne('black')">Black</div>
    <div class="chip" onclick="showOne('cream')">Cream</div>
  </div>

  <label>Headline</label>
  <input type="text" value="Freedom Riders" oninput="setText('hl', this.value)">

  <label>Subline</label>
  <input type="text" value="Anniston, Alabama · 1961" oninput="setText('sub', this.value)">

  <label>Credit</label>
  <input type="text" value="Southern Legends" oninput="setText('cr', this.value)">

  <hr class="ep-divider">

  <label>Headline size (black)</label>
  <input type="range" min="24" max="72" value="42" oninput="setSize('hl-black', this.value)">

  <label>Subline size (black)</label>
  <input type="range" min="12" max="36" value="18" oninput="setSize('sub-black', this.value)">

  <label>Subline color (black shirt)</label>
  <input type="color" value="#ca8a04" oninput="document.getElementById('sub-black').style.color=this.value">

  <hr class="ep-divider">

  <label>Headline size (cream)</label>
  <input type="range" min="24" max="72" value="42" oninput="setSize('hl-cream', this.value)">

  <label>Subline color (cream shirt)</label>
  <input type="color" value="#7a4800" oninput="document.getElementById('sub-cream').style.color=this.value">

  <hr class="ep-divider">

  <button class="ep-btn" onclick="hidePanel()">H — Hide panel for screenshot</button>
  <button class="ep-btn" onclick="window.print()">Print / Export PDF</button>
</div>

<script>
  function setText(prefix, val) {
    ['black','cream'].forEach(v => {
      const el = document.getElementById(prefix+'-'+v);
      if (el) el.textContent = val;
    });
  }
  function setSize(id, val) {
    document.getElementById(id).style.fontSize = val+'px';
  }
  function showOne(color) {
    document.getElementById('design-black').style.display = color === 'black' ? 'flex' : 'none';
    document.getElementById('design-cream').style.display = color === 'cream' ? 'flex' : 'none';
    document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
    event.target.classList.add('active');
    document.body.style.padding = '40px 300px 60px 40px';
  }
  function showBoth() {
    document.getElementById('design-black').style.display = 'flex';
    document.getElementById('design-cream').style.display = 'flex';
    document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
    event.target.classList.add('active');
  }
  let panelVisible = true;
  function hidePanel() {
    panelVisible = !panelVisible;
    document.getElementById('ep').style.display = panelVisible ? 'block' : 'none';
    document.body.style.padding = panelVisible ? '40px 300px 60px 40px' : '40px';
  }
  document.addEventListener('keydown', e => {
    if (e.key === 'h' || e.key === 'H') hidePanel();
  });
</script>
</body>
</html>
