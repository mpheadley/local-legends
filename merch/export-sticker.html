<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 500px; height: 500px; background: transparent; }
  .sticker {
    width: 500px;
    height: 500px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .badge { width: 440px; height: 440px; position: relative; z-index: 1; }
  .curve-svg {
    position: absolute;
    top: 0; left: 0;
    width: 500px;
    height: 500px;
    z-index: 2;
  }
</style>
</head>
<body>
  <div class="sticker">
    <img class="badge" src="chief-ladiga-badge-vector.svg" alt="">
    <svg class="curve-svg" viewBox="0 0 500 500">
      <defs>
        <path id="curve" d="M 28,250 A 222,222 0 0,0 472,250" />
      </defs>
      <text font-family="Fraunces, serif" font-size="22" fill="#1c1917" opacity="0.70" letter-spacing="3">
        <textPath href="#curve" startOffset="50%" text-anchor="middle">southernlegends.blog</textPath>
      </text>
    </svg>
  </div>
</body>
</html>
