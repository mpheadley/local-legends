<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CLT × SL Design Preview</title>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Fraunces:ital,opsz,wght@0,9..144,400;1,9..144,400&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a1a;
    display: flex;
    gap: 60px;
    justify-content: center;
    align-items: center;
    padding: 60px 40px;
    min-height: 100vh;
    flex-wrap: wrap;
  }

  .mockup-label {
    color: #666;
    font-family: monospace;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    text-align: center;
    margin-bottom: 12px;
  }

  /* Tote shape */
  .tote {
    width: 320px;
    height: 340px;
    background: #f5f0e8;
    border-radius: 4px 4px 8px 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  .tote::before {
    content: '';
    position: absolute;
    top: -32px;
    left: 80px;
    width: 50px;
    height: 36px;
    border: 4px solid #c8b89a;
    border-bottom: none;
    border-radius: 40px 40px 0 0;
  }
  .tote::after {
    content: '';
    position: absolute;
    top: -32px;
    right: 80px;
    width: 50px;
    height: 36px;
    border: 4px solid #c8b89a;
    border-bottom: none;
    border-radius: 40px 40px 0 0;
  }

  /* Shirt shape */
  .shirt {
    width: 320px;
    height: 360px;
    background: #f5f0e8;
    clip-path: polygon(
      15% 0%, 85% 0%,
      100% 10%, 95% 16%, 88% 10%,
      88% 100%, 12% 100%,
      12% 10%, 5% 16%, 0% 10%
    );
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .design {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
    padding: 0 20px;
  }

  .badge {
    width: 170px;
    height: 170px;
    object-fit: contain;
  }

  .year {
    font-family: 'IM Fell English', serif;
    font-size: 34px;
    color: #1c1917;
    line-height: 1.1;
    margin-top: -4px;
    display: block;
  }

  .url {
    font-family: 'Fraunces', serif;
    font-style: normal;
    font-weight: 400;
    font-size: 9px;
    color: #1c1917;
    letter-spacing: 2px;
    margin-top: 6px;
    display: block;
    opacity: 0.70;
  }

  /* Sticker mockup */
  .sticker {
    width: 220px;
    height: 220px;
    border-radius: 50%;
    background: #f5f0e8;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0;
    position: relative;
  }

  .sticker .badge {
    width: 190px;
    height: 190px;
  }

  .sticker .url {
    margin-top: 0;
    font-size: 8px;
    letter-spacing: 1.5px;
  }

  .sl {
    font-family: 'IM Fell English', serif;
    font-style: italic;
    font-size: 15px;
    color: #1c1917;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-top: 6px;
    display: block;
    opacity: 0.75;
  }
</style>
</head>
<body>

  <div>
    <div class="mockup-label">Sticker — 3"</div>
    <div class="sticker">
      <svg width="220" height="220" viewBox="0 0 220 220" style="position:absolute;top:0;left:0;">
        <defs>
          <!-- radius 103 = just outside the badge circle (badge is ~155px = r77, sticker r110, so r103 sits between) -->
          <path id="curve" d="M 12,110 A 98,98 0 0,0 208,110" />
        </defs>
        <text font-family="Fraunces, serif" font-size="11" fill="#1c1917" opacity="0.70" letter-spacing="2">
          <textPath href="#curve" startOffset="50%" text-anchor="middle">southernlegends.blog</textPath>
        </text>
      </svg>
      <img class="badge" src="chief-ladiga-badge-vector.svg" alt="CLT badge" style="width:195px;height:195px;">
    </div>
  </div>

  <div>
    <div class="mockup-label">Tote — Natural/Cream</div>
    <div class="tote">
      <div class="design">
        <img class="badge" src="chief-ladiga-badge-vector.svg" alt="CLT badge">
        <span class="year">1832</span>
        <span class="sl">Southern Legends</span>
        <span class="url">southernlegends.blog</span>
      </div>
    </div>
  </div>

  <div>
    <div class="mockup-label">Shirt — Natural/Cream</div>
    <div class="shirt">
      <div class="design">
        <img class="badge" src="chief-ladiga-badge-vector.svg" alt="CLT badge">
        <span class="year">1832</span>
        <span class="sl">Southern Legends</span>
        <span class="url">southernlegends.blog</span>
      </div>
    </div>
  </div>

</body>
</html>
