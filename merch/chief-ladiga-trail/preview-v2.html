<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CLT Back v2 — Preview</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a1a;
    display: flex;
    gap: 60px;
    justify-content: center;
    align-items: flex-start;
    padding: 60px 40px;
    min-height: 100vh;
    flex-wrap: wrap;
  }
  .label {
    color: #666;
    font-family: monospace;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    text-align: center;
    margin-bottom: 12px;
  }
  .shirt {
    width: 340px;
    height: 390px;
    background: #f5f0e8;
    clip-path: polygon(
      15% 0%, 85% 0%,
      100% 10%, 95% 16%, 88% 10%,
      88% 100%, 12% 100%,
      12% 10%, 5% 16%, 0% 10%
    );
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .shirt img {
    width: 90%;
    height: 90%;
    object-fit: contain;
  }
  /* Full print preview */
  .print-wrap {
    background: #f5f0e8;
    padding: 24px;
    width: 380px;
  }
  .print-wrap img {
    width: 100%;
    display: block;
  }
</style>
</head>
<body>

  <div>
    <div class="label">Shirt Back v2</div>
    <div class="shirt">
      <img src="clt-tshirt-back-v2.svg" alt="Shirt back v2">
    </div>
  </div>

  <div>
    <div class="label">Shirt Back v3 — Landmark Callouts</div>
    <div class="shirt">
      <img src="clt-tshirt-back-v3.svg" alt="Shirt back v3">
    </div>
  </div>

  <div>
    <div class="label">v3 — Full Print View</div>
    <div class="print-wrap">
      <img src="clt-tshirt-back-v3.svg" alt="Print v3">
    </div>
  </div>

</body>
</html>
