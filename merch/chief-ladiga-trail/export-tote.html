<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Fraunces:ital,opsz,wght@0,9..144,400;1,9..144,400&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 500px; height: 500px; background: transparent; }
  .design {
    width: 500px;
    height: 500px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0;
  }
  .badge { width: 280px; height: 280px; object-fit: contain; }
  .year {
    font-family: 'IM Fell English', serif;
    font-size: 52px;
    color: #1c1917;
    line-height: 1.1;
    margin-top: -4px;
    display: block;
  }
  .sl {
    font-family: 'IM Fell English', serif;
    font-style: italic;
    font-size: 22px;
    color: #1c1917;
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-top: 8px;
    display: block;
    opacity: 0.75;
  }
  .url {
    font-family: 'Fraunces', serif;
    font-size: 13px;
    color: #1c1917;
    letter-spacing: 2px;
    margin-top: 8px;
    display: block;
    opacity: 0.70;
  }
</style>
</head>
<body>
  <div class="design">
    <img class="badge" src="chief-ladiga-badge-vector.svg" alt="">
    <span class="year">1832</span>
    <span class="sl">Southern Legends</span>
    <span class="url">southernlegends.blog</span>
  </div>
</body>
</html>
