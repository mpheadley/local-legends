.3 L 653.3,2505.8 L 676.4,2446.9 L 681.6,2433.8 L 682.2,2432.7 L 690.0,2412.7 L 690.6,2411.7 L 694.8,2400.6 L 697.9,2392.2 L 700.0,2388.6 L 701.6,2384.4 L 707.9,2368.1 L 709.5,2363.9 L 710.0,2362.8 L 713.7,2362.3 L 717.4,2355.4 L 717.4,2344.9 L 718.4,2339.1 L 724.7,2324.4 L 733.7,2301.8 L 744.7,2272.9 L 769.4,2226.1 L 815.2,2143.6 L 838.8,2106.8 L 867.7,2070.5 L 907.7,2020.1 L 933.4,1987.5 L 968.7,1950.1 L 993.9,1927.0 L 1031.7,1901.3 L 1099.0,1858.2 L 1157.4,1824.0 L 1211.0,1796.7 L 1266.2,1772.5 L 1328.2,1748.8 L 1394.4,1706.8 L 1435.4,1690.5 L 1487.0,1682.1 L 1544.8,1648.9 L 1597.4,1604.3 L 1647.8,1563.3 L 1693.0,1540.7 L 1744.0,1526.5 L 1792.9,1524.9 L 1841.3,1519.1 L 1887.0,1520.7 L 1936.9,1521.7 L 2000.5,1521.7 L 2083.1,1522.3 L 2143.0,1541.2 L 2173.5,1555.9 L 2242.4,1592.2 L 2301.2,1624.2 L 2338.5,1657.9 L 2374.8,1687.8 L 2421.6,1702.6 L 2463.7,1677.9 L 2505.2,1650.0 L 2557.8,1602.7 L 2620.3,1548.5 L 2657.1,1510.2 L 2691.8,1486.5 L 2747.0,1472.3 L 2805.3,1456.5 L 2859.0,1430.3 L 2901.0,1403.5 L 2930.5,1358.2 L 2970.9,1336.2 L 3034.0,1319.3 L 3101.8,1312.5 L 3150.7,1318.8 L 3192.2,1317.2 L 3253.2,1302.5 L 3297.9,1292.5 L 3300.0,1291.5"/>
  <path id="silverComet" fill="none" d="M 3300.0,1291.5 L 3450,1150 L 3560,1050"/>
</defs>


<!-- ── TITLE ─────────────────────────────────────────────── -->
<text x="1800" y="200" text-anchor="middle"
      font-size="200" fill="#292524" font-weight="bold" letter-spacing="32">CHIEF LADIGA TRAIL</text>
<text x="1800" y="350" text-anchor="middle"
      font-size="150" fill="#292524" letter-spacing="12" font-style="italic">Anniston to Piedmont, Alabama · 39.5 miles</text>
<text x="1800" y="600" text-anchor="middle"
      font-size="220" fill="#9A3412" font-style="italic" letter-spacing="3">1832 — 2032</text>


<!-- ── TRAIL ─────────────────────────────────────────────── -->
<g>
  <use href="#trailPath" stroke="#292524" stroke-width="60" stroke-linecap="round" stroke-linejoin="round" opacity="0.20"/>
  <use href="#trailPath" stroke="#CA8A04" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<use href="#silverComet" stroke="#292524" stroke-width="18" stroke-linecap="round"
     stroke-dasharray="40,40" opacity="0.35"/>


<!-- ── TOWN DOTS ──────────────────────────────────────────── -->
<circle cx="300" cy="3708.5" r="56" fill="#9A3412"/>
<circle cx="300" cy="3708.5" r="56" fill="none" stroke="#292524" stroke-width="14"/>
<text x="380" y="3735" font-size="80" fill="#292524" font-weight="bold" letter-spacing="5">ANNISTON</text>
<text x="380" y="3808" font-size="50" fill="#292524" font-style="italic" opacity="0.60">Amtrak depot · 2025 extension</text>

<circle cx="444.6" cy="2912.1" r="40" fill="none" stroke="#292524" stroke-width="13"/>
<text x="524" y="2935" font-size="70" fill="#292524" letter-spacing="3">WEAVER</text>

<circle cx="713.7" cy="2364.4" r="48" fill="none" stroke="#292524" stroke-width="13"/>
<text x="793" y="2390" font-size="78" fill="#292524" letter-spacing="4">JACKSONVILLE</text>
<text x="793" y="2458" font-size="52" fill="#292524" font-style="italic" opacity="0.60">Founded on Ladiga's allotment, 1833</text>

<circle cx="1844.9" cy="1525.9" r="56" fill="#9A3412"/>
<circle cx="1844.9" cy="1525.9" r="56" fill="none" stroke="#292524" stroke-width="14"/>
<text x="1844.9" y="1450" text-anchor="middle" font-size="80" fill="#292524" font-weight="bold" letter-spacing="5">PIEDMONT</text>
<text x="1844.9" y="1375" text-anchor="middle" font-size="50" fill="#292524" font-style="italic" opacity="0.60">Chief Ladiga is buried near here</text>

<circle cx="3300.5" cy="1293.6" r="40" fill="none" stroke="#292524" stroke-width="13"/>
<text x="3300.5" y="1230" text-anchor="middle" font-size="60" fill="#292524" letter-spacing="3" font-style="italic">→ GEORGIA</text>
<text x="3300.5" y="1158" text-anchor="middle" font-size="44" fill="#292524" font-style="italic" opacity="0.50">Silver Comet Trail · Atlanta · 105 mi</text>


<!-- ── TREATY STAMP ──────────────────────────────────────── -->
<circle cx="2100" cy="3100" r="260" fill="none" stroke="#9A3412" stroke-width="11" stroke-dasharray="14,18"/>
<circle cx="2100" cy="3100" r="200" fill="none" stroke="#9A3412" stroke-width="4"/>
<g transform="translate(2100, 2950)">
  <path d="M 0,-68 L 16,-12 L 74,-12 L 27,21 L 45,78 L 0,44 L -45,78 L -27,21 L -74,-12 L -16,-12 Z" fill="#9A3412"/>
</g>
<text x="2100" y="3200" text-anchor="middle" font-size="220" fill="#9A3412" font-style="italic" font-weight="bold">1832</text>
<text x="2100" y="3360" text-anchor="middle" font-size="120" fill="#9A3412" letter-spacing="5" font-weight="bold">TREATY OF CUSSETA</text>


<!-- ════════════════════════════════════════════════════════
     LANDMARK CALLOUTS — connecting lines first, then boxes
     ════════════════════════════════════════════════════════ -->

<!-- Connecting lines — thin, low opacity -->
<!-- Anniston depot line: dot (300,3708) → box left edge (1380,3800) -->
<line x1="356" y1="3708" x2="1380" y2="3800" stroke="#292524" stroke-width="10" opacity="0.25" stroke-dasharray="20,20"/>
<!-- Weaver tree tunnel: dot (484,2912) → box left edge (1320,2680) -->
<line x1="484" y1="2912" x2="1320" y2="2740" stroke="#292524" stroke-width="10" opacity="0.25" stroke-dasharray="20,20"/>
<!-- JSU tower: dot (761,2364) → box left edge (1620,2180) -->
<line x1="761" y1="2364" x2="1620" y2="2260" stroke="#292524" stroke-width="10" opacity="0.25" stroke-dasharray="20,20"/>
<!-- Piedmont: dot (1900,1526) → box left edge (2500,1700) -->
<line x1="1900" y1="1526" x2="2500" y2="1760" stroke="#292524" stroke-width="10" opacity="0.25" stroke-dasharray="20,20"/>


<!-- ── CALLOUT 1: ANNISTON DEPOT ─────────────────────────
     1925 Southern Railway, classical revival
     Pediment over 3 round-arched windows, two side wings
     Box: 1380,3720 → 2280,4080 (900w × 360h) -->
<rect x="1380" y="3720" width="900" height="360" fill="none" stroke="#292524" stroke-width="8" opacity="0.35"/>

<g transform="translate(1440, 3740)">
  <!-- Side wings -->
  <rect x="0" y="140" width="140" height="110" fill="#292524" opacity="0.85"/>
  <rect x="640" y="140" width="140" height="110" fill="#292524" opacity="0.85"/>
  <!-- Main body -->
  <rect x="100" y="150" width="580" height="100" fill="#292524" opacity="0.85"/>
  <!-- Central pediment -->
  <polygon points="200,150 390,55 580,150" fill="#292524" opacity="0.85"/>
  <!-- Three arched windows (light cutouts) -->
  <ellipse cx="285" cy="148" rx="28" ry="36" fill="#fafaf7" opacity="0.7"/>
  <ellipse cx="390" cy="148" rx="28" ry="36" fill="#fafaf7" opacity="0.7"/>
  <ellipse cx="495" cy="148" rx="28" ry="36" fill="#fafaf7" opacity="0.7"/>
  <!-- Platform -->
  <rect x="-10" y="248" width="800" height="14" fill="#292524" opacity="0.6"/>
  <!-- Label -->
  <text x="390" y="295" text-anchor="middle" font-size="44" fill="#292524" opacity="0.70" font-style="italic">Anniston Depot · 1925</text>
</g>


<!-- ── CALLOUT 2: WEAVER TREE TUNNEL ─────────────────────
     Arching canopy over the trail corridor
     Box: 1320,2620 → 2160,2900 (840w × 280h) -->
<rect x="1320" y="2620" width="840" height="280" fill="none" stroke="#292524" stroke-width="8" opacity="0.35"/>

<g transform="translate(1360, 2630)">
  <!-- Left trunk -->
  <rect x="20" y="165" width="28" height="80" fill="#292524" opacity="0.80"/>
  <!-- Right trunk -->
  <rect x="712" y="165" width="28" height="80" fill="#292524" opacity="0.80"/>
  <!-- Left canopy arc -->
  <path d="M 0,165 Q 80,40 380,20" stroke="#292524" stroke-width="55" fill="none" stroke-linecap="round" opacity="0.80"/>
  <!-- Right canopy arc -->
  <path d="M 760,165 Q 680,40 380,20" stroke="#292524" stroke-width="55" fill="none" stroke-linecap="round" opacity="0.80"/>
  <!-- Trail path through tunnel (gap at bottom) -->
  <rect x="340" y="220" width="80" height="10" fill="#fafaf7" opacity="0.5"/>
  <!-- Label -->
  <text x="380" y="245" text-anchor="middle" font-size="44" fill="#292524" opacity="0.70" font-style="italic">The Tree Tunnel · Weaver</text>
</g>


<!-- ── CALLOUT 3: JSU HOUSTON COLE LIBRARY ───────────────
     13-story tower, tallest academic building in Alabama
     Box: 1620,2080 → 2160,2580 (540w × 500h) -->
<rect x="1620" y="2080" width="540" height="500" fill="none" stroke="#292524" stroke-width="8" opacity="0.35"/>

<g transform="translate(1660, 2100)">
  <!-- Tower body — narrow, 13-story -->
  <rect x="155" y="0" width="150" height="390" fill="#292524" opacity="0.85"/>
  <!-- Penthouse / mechanical top -->
  <rect x="165" y="-22" width="130" height="26" fill="#292524" opacity="0.85"/>
  <!-- Base plaza — wider -->
  <rect x="80" y="385" width="300" height="28" fill="#292524" opacity="0.75"/>
  <!-- Window grid — horizontal floor lines -->
  <line x1="155" y1="30"  x2="305" y2="30"  stroke="#fafaf7" stroke-width="5" opacity="0.5"/>
  <line x1="155" y1="60"  x2="305" y2="60"  stroke="#fafaf7" stroke-width="5" opacity="0.5"/>
  <line x1="155" y1="90"  x2="305" y2="90"  stroke="#fafaf7" stroke-width="5" opacity="0.5"/>
  <line x1="155" y1="120" x2="305" y2="120" stroke="#fafaf7" stroke-width="5" opacity="0.5"/>
  <line x1="155" y1="150" x2="305" y2="150" stroke="#fafaf7" stroke-width="5" opacity="0.5"/>
  <line x1="155" y1="180" x2="305" y2="180" stroke="#fafaf7" stroke-width="5" opacity="0.5"/>
  <line x1="155" y1="210" x2="305" y2="210" stroke="#fafaf7" stroke-width="5" opacity="0.5"/>
  <line x1="155" y1="240" x2="305" y2="240" stroke="#fafaf7" stroke-width="5" opacity="0.5"/>
  <line x1="155" y1="270" x2="305" y2="270" stroke="#fafaf7" stroke-width="5" opacity="0.5"/>
  <line x1="155" y1="300" x2="305" y2="300" stroke="#fafaf7" stroke-width="5" opacity="0.5"/>
  <line x1="155" y1="330" x2="305" y2="330" stroke="#fafaf7" stroke-width="5" opacity="0.5"/>
  <line x1="155" y1="360" x2="305" y2="360" stroke="#fafaf7" stroke-width="5" opacity="0.5"/>
  <!-- Vertical center divide -->
  <line x1="230" y1="0" x2="230" y2="385" stroke="#fafaf7" stroke-width="4" opacity="0.4"/>
  <!-- Label -->
  <text x="230" y="440" text-anchor="middle" font-size="40" fill="#292524" opacity="0.70" font-style="italic">Houston Cole Library</text>
  <text x="230" y="483" text-anchor="middle" font-size="36" fill="#292524" opacity="0.55" font-style="italic">Jacksonville State · 1972</text>
</g>


<!-- ── CALLOUT 4: PIEDMONT TRAIL END ─────────────────────
     Trail terminus marker post
     Box: 2500,1700 → 3300,1960 (800w × 260h) -->
<rect x="2500" y="1700" width="800" height="260" fill="none" stroke="#292524" stroke-width="8" opacity="0.35"/>

<g transform="translate(2540, 1715)">
  <!-- Post -->
  <rect x="320" y="20" width="22" height="180" fill="#292524" opacity="0.85"/>
  <!-- Sign board — main -->
  <rect x="200" y="20" width="260" height="75" rx="4" fill="#292524" opacity="0.85"/>
  <!-- Sign text (white) -->
  <text x="330" y="67" text-anchor="middle" font-size="38" fill="#fafaf7" opacity="0.90" font-weight="bold" letter-spacing="3">END OF TRAIL</text>
  <!-- Secondary sign below -->
  <rect x="230" y="108" width="200" height="52" rx="3" fill="#292524" opacity="0.70"/>
  <text x="330" y="140" text-anchor="middle" font-size="30" fill="#fafaf7" opacity="0.80">39.5 mi</text>
  <!-- Ground line -->
  <line x1="260" y1="200" x2="400" y2="200" stroke="#292524" stroke-width="8" opacity="0.50"/>
  <!-- Label -->
  <text x="330" y="230" text-anchor="middle" font-size="40" fill="#292524" opacity="0.70" font-style="italic">Piedmont Terminus</text>
</g>


<!-- ── FOOTER ─────────────────────────────────────────────── -->
<text x="1800" y="4720" text-anchor="middle"
      font-size="70" fill="#292524" letter-spacing="8" opacity="0.38" font-style="italic">chiefladiga.org</text>

</svg>
