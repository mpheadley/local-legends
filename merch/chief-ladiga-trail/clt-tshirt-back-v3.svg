<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3600 4800" width="3600" height="4800"
     role="img" aria-label="Chief Ladiga Trail t-shirt — back print v3 with landmark callouts">

<!--
  PRINT SPEC — BACK PRINT v3
  ─────────────────────────────────────────────
  Canvas: 3600×4800px = 12×16 inches at 300 DPI
  New in v3: landmark silhouette callouts with connecting lines
    - Anniston: 1925 depot (classical revival)
    - Weaver: tree tunnel (arching canopy)
    - Jacksonville: Houston Cole Library tower (13 stories, JSU)
    - Piedmont: trail terminus marker
  Also carries all v2 additions:
    - Silver Comet extension, Jacksonville + Piedmont historical notes
    - chiefladiga.org, CUSSETA spelling fix
-->

