<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 780" width="600" height="780">
  <rect width="600" height="780" fill="#FAFAF7"/>

  <!-- Trail blaze badge: dark circle, white blaze inside -->
  <circle cx="300" cy="95" r="68" fill="#1C1917"/>
  <rect x="271" y="58" width="58" height="76" rx="4" fill="#FAFAF7"/>

  <!-- Main stacked wordmark -->
  <text x="300" y="300"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-weight="700"
    font-size="110"
    fill="#1C1917"
    letter-spacing="-1">CHIEF</text>

  <text x="300" y="420"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-weight="700"
    font-size="110"
    fill="#1C1917"
    letter-spacing="-1">LADIGA</text>

  <text x="300" y="540"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-weight="700"
    font-size="110"
    fill="#1C1917"
    letter-spacing="-1">TRAIL</text>

  <!-- Thin rule -->
  <line x1="100" y1="568" x2="500" y2="568"
    stroke="#1C1917" stroke-width="1.2"/>

  <!-- Sub-text -->
  <text x="300" y="598"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="16"
    fill="#1C1917"
    letter-spacing="5">ANNISTON, ALABAMA</text>

  <text x="300" y="622"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="16"
    fill="#1C1917"
    letter-spacing="5">39.5 MILES</text>

  <!-- SL wordmark -->
  <rect x="272" y="654" width="56" height="56" rx="8" fill="#1C1917"/>
  <text x="300" y="688"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-weight="700"
    font-size="26"
    fill="#FAFAF7"
    letter-spacing="-0.5">SL</text>
</svg>
