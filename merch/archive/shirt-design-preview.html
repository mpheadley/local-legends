<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CLT × SL Shirt Design</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,700;0,900;1,400&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #2a2a2a;
    display: flex;
    gap: 60px;
    justify-content: center;
    align-items: flex-start;
    padding: 60px 40px;
    flex-wrap: wrap;
    min-height: 100vh;
  }

  .shirt-mockup {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }

  .shirt-mockup h3 {
    color: #888;
    font-family: monospace;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  /* Shirt shape */
  .shirt {
    width: 380px;
    height: 440px;
    background: var(--shirt-color, #f5f0e8);
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    clip-path: polygon(
      15% 0%, 85% 0%,
      100% 10%, 95% 15%, 88% 10%,
      88% 100%, 12% 100%,
      12% 10%, 5% 15%, 0% 10%
    );
  }

  .design {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
    margin-top: -10px;
  }

  .badge-wrap {
    width: 200px;
    height: 200px;
  }

  .badge-wrap img {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  .year {
    font-family: 'IM Fell English', serif;
    font-size: 42px;
    font-weight: 400;
    color: var(--text-color, #1a1a1a);
    letter-spacing: 4px;
    line-height: 1;
    margin-top: 8px;
  }

  .sl-name {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-size: 13px;
    font-weight: 400;
    color: var(--text-color, #1a1a1a);
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-top: 6px;
    opacity: 0.75;
  }

  /* Variant: natural/cream */
  .v-natural { --shirt-color: #f5f0e8; --text-color: #1a1a1a; }

  /* Variant: black */
  .v-black { --shirt-color: #111111; --text-color: #f5f0e8; }
  .v-black .year { color: #c8a96e; }
  .v-black .sl-name { color: #c8a96e; }

  /* Variant: forest green */
  .v-green { --shirt-color: #2d4a2d; --text-color: #f5f0e8; }
  .v-green .year { color: #e8dcc8; }
  .v-green .sl-name { color: #e8dcc8; }
</style>
</head>
<body>

  <!-- Natural/Cream -->
  <div class="shirt-mockup">
    <h3>Natural / Cream</h3>
    <div class="shirt v-natural">
      <div class="design">
        <div class="badge-wrap">
          <img src="chief-ladiga-anniston-official-logo.jpg" alt="Chief Ladiga Trail">
        </div>
        <div class="year">1832</div>
        <div class="sl-name">Southern Legends</div>
      </div>
    </div>
  </div>

  <!-- Black -->
  <div class="shirt-mockup">
    <h3>Black</h3>
    <div class="shirt v-black">
      <div class="design">
        <div class="badge-wrap">
          <img src="chief-ladiga-anniston-official-logo.jpg" alt="Chief Ladiga Trail">
        </div>
        <div class="year">1832</div>
        <div class="sl-name">Southern Legends</div>
      </div>
    </div>
  </div>

  <!-- Forest Green -->
  <div class="shirt-mockup">
    <h3>Forest Green</h3>
    <div class="shirt v-green">
      <div class="design">
        <div class="badge-wrap">
          <img src="chief-ladiga-anniston-official-logo.jpg" alt="Chief Ladiga Trail">
        </div>
        <div class="year">1832</div>
        <div class="sl-name">Southern Legends</div>
      </div>
    </div>
  </div>

</body>
</html>
