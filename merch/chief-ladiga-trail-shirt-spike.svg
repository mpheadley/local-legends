<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 820" width="600" height="820">
  <rect width="600" height="820" fill="#FAFAF7"/>

  <!-- Railroad spike, side profile — centered, more room below -->
  <rect x="242" y="30" width="116" height="36" rx="3" fill="#1C1917"/>
  <rect x="276" y="66" width="48" height="16" fill="#1C1917"/>
  <rect x="282" y="82" width="36" height="110" fill="#1C1917"/>
  <polygon points="282,192 318,192 300,240" fill="#1C1917"/>

  <!-- Main stacked wordmark — more gap from spike -->
  <text x="300" y="360"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-weight="700"
    font-size="110"
    fill="#1C1917"
    letter-spacing="-1">CHIEF</text>

  <text x="300" y="480"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-weight="700"
    font-size="110"
    fill="#1C1917"
    letter-spacing="-1">LADIGA</text>

  <text x="300" y="600"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-weight="700"
    font-size="110"
    fill="#1C1917"
    letter-spacing="-1">TRAIL</text>

  <!-- Thin rule -->
  <line x1="100" y1="626" x2="500" y2="626"
    stroke="#1C1917" stroke-width="1.2"/>

  <!-- Sub-text -->
  <text x="300" y="656"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="16"
    fill="#1C1917"
    letter-spacing="5">ANNISTON, ALABAMA</text>

  <text x="300" y="680"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="16"
    fill="#1C1917"
    letter-spacing="5">39.5 MILES</text>

  <!-- SL wordmark -->
  <rect x="272" y="712" width="56" height="56" rx="8" fill="#1C1917"/>
  <text x="300" y="746"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-weight="700"
    font-size="26"
    fill="#FAFAF7"
    letter-spacing="-0.5">SL</text>
</svg>
