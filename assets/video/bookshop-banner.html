<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 16px; }

  .banner {
    width: 2048px;
    height: 600px;
    position: relative;
    overflow: hidden;
    background: linear-gradient(to right, #9A3412 0%, #CA8A04 45%, #1C1917 100%);
  }

  .topo {
    position: absolute;
    inset: 0;
    background-image: url('/Volumes/Samsung_T5/webdev/southern-legends/topo-7.png');
    background-repeat: repeat;
    background-size: 320px;
    opacity: 0.15;
  }

  /* large bg mark, very faint — offset right */
  .mark-bg {
    position: absolute;
    width: 700px;
    height: 700px;
    top: 50%;
    right: 80px;
    transform: translateY(-50%);
    opacity: 0.06;
    pointer-events: none;
  }

  .vignette {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 40% 50%, transparent 30%, rgba(0,0,0,0.45) 100%);
    pointer-events: none;
  }

  /* left-aligned content */
  .content {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    justify-content: center;
    padding: 0 120px;
    gap: 20px;
  }

  .mark-row {
    display: flex;
    align-items: center;
    gap: 28px;
  }

  .sl-mark {
    width: 96px;
    height: 96px;
    display: block;
    flex-shrink: 0;
  }

  .wordmark {
    font-family: 'Georgia', serif;
    color: #F0EDE6;
    font-size: 86px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    line-height: 1;
    text-shadow: 0 4px 60px rgba(0,0,0,0.4);
  }

  .rule {
    width: 480px;
    height: 1.5px;
    background: #CA8A04;
  }

  .sub {
    font-family: 'Georgia', serif;
    color: rgba(240,237,230,0.78);
    font-size: 28px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
  }

  .byline {
    font-family: 'Georgia', serif;
    color: rgba(240,237,230,0.5);
    font-size: 20px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    margin-top: 4px;
  }
</style>
</head>
<body>

<div class="banner" id="banner">
  <div class="topo"></div>

  <svg class="mark-bg" viewBox="0 0 96 96" xmlns="http://www.w3.org/2000/svg">
    <circle cx="48" cy="48" r="44" fill="#F0EDE6"/>
    <text x="48" y="63" text-anchor="middle" font-family="Georgia,serif" font-weight="700" font-size="40" fill="#1C1917" letter-spacing="-1">SL</text>
    <line x1="20" y1="70" x2="76" y2="70" stroke="#CA8A04" stroke-width="1.5"/>
  </svg>

  <div class="vignette"></div>

  <div class="content">
    <div class="mark-row">
      <svg class="sl-mark" viewBox="0 0 96 96" xmlns="http://www.w3.org/2000/svg">
        <circle cx="48" cy="48" r="44" fill="#292524" opacity="0.7"/>
        <text x="48" y="63" text-anchor="middle" font-family="Georgia,serif" font-weight="700" font-size="40" fill="#F0EDE6" letter-spacing="-1">SL</text>
        <line x1="20" y1="70" x2="76" y2="70" stroke="#CA8A04" stroke-width="1.5"/>
      </svg>
      <div class="wordmark">Southern Legends</div>
    </div>
    <div class="rule"></div>
    <div class="sub">Books Worth Reading</div>
    <div class="byline">Curated by Matt Headley · Northeast Alabama</div>
  </div>
</div>

</body>
</html>
