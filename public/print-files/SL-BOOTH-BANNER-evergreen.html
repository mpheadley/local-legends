<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Southern Legends — Booth Banner 8′ × 2.5′ (Evergreen)</title>
<style>
  @font-face {
    font-family: 'Fraunces';
    src: url('../../src/app/fonts/Fraunces-SemiBold.ttf') format('truetype');
    font-weight: 700;
  }
  @font-face {
    font-family: 'SourceSans';
    src: url('../../src/app/fonts/SourceSans3-Regular.ttf') format('truetype');
    font-weight: 400;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 720px; overflow: hidden; }

  .banner {
    position: relative;
    width: 1920px;
    height: 720px;
    background: #1C1917;
    overflow: hidden;
  }

  /* Left watercolor zone */
  .left-bg {
    position: absolute;
    top: 0; left: 0;
    width: 920px;
    height: 100%;
    z-index: 0;
    overflow: hidden;
  }
  .left-bg img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center center;
    display: block;
    transform: scale(1.1);
    transform-origin: center center;
  }

  /* Gold bars — full width */
  .bar-top    { position: absolute; top: 0;    left: 0; right: 0; height: 7px; background: #CA8A04; z-index: 20; }
  .bar-bottom { position: absolute; bottom: 0; left: 0; right: 0; height: 7px; background: #CA8A04; z-index: 20; }

  /* ─── BENTO COLLAGE ─── */
  /* 4-col × 2-row grid, right 1000px. Face-first crop on every cell. */
  .collage {
    position: absolute;
    right: 0; top: 0;
    width: 1000px;
    height: 100%;
    z-index: 2;
    display: grid;
    gap: 4px;
    grid-template-columns: 2fr 1fr 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    grid-template-areas:
      "big  jean  shan  sam"
      "big  lewis wood  bus";
    overflow: hidden;
    background: #111;
  }
  .cc {
    position: relative;
    overflow: hidden;
  }
  .cc img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 15%; /* bias toward faces */
    display: block;
  }

  /* Named grid placements */
  .c-big   { grid-area: big; }
  .c-jean  { grid-area: jean; }
  .c-shan  { grid-area: shan; }
  .c-sam   { grid-area: sam; }
  .c-lewis { grid-area: lewis; }
  .c-bus   { grid-area: bus; }
  .c-wood { grid-area: wood; }

  /* Subtle dark vignette on each face cell — deepens toward edges */
  .cc::after {
    content: '';
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at 50% 30%, transparent 40%, rgba(28,25,23,0.45) 100%);
    pointer-events: none;
  }
  .c-wood::after { display: none; }

  /* Gold seam at left edge of collage */
  .collage::before {
    content: '';
    position: absolute; top: 0; left: 0;
    width: 2px; height: 100%;
    background: #CA8A04;
    z-index: 10;
  }

  /* ─── TEXT ─── */
  .content {
    position: absolute;
    top: 0; left: 0;
    width: 920px;
    height: 100%;
    z-index: 5;
    display: flex;
    align-items: center;
    padding: 60px 80px;
  }

  .eyebrow {
    font-family: 'SourceSans', system-ui, sans-serif;
    font-size: 13px;
    letter-spacing: 0.34em;
    text-transform: uppercase;
    color: #CA8A04;
    margin-bottom: 18px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .eyebrow::before {
    content: '';
    width: 20px; height: 2px;
    background: #CA8A04;
    flex-shrink: 0;
  }

  .wm {
    display: block;
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 700;
    font-size: 178px;
    line-height: 0.86;
    text-transform: uppercase;
    letter-spacing: -5px;
    color: #9B1C1C;
    text-shadow:
      0 2px 4px rgba(0,0,0,0.9),
      0 4px 12px rgba(0,0,0,0.8),
      0 8px 24px rgba(0,0,0,0.6),
      2px 2px 0px rgba(0,0,0,0.7);
  }

  .tagline {
    font-family: 'SourceSans', system-ui, sans-serif;
    font-size: 15px;
    color: rgba(240,237,230,0.44);
    letter-spacing: 0.24em;
    text-transform: uppercase;
    margin-top: 24px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .dot { width: 3px; height: 3px; border-radius: 50%; background: #CA8A04; flex-shrink: 0; }

  /* URL chip — bottom-right of collage */
  .url-block {
    position: absolute;
    right: 18px; bottom: 18px;
    z-index: 15;
    background: rgba(28,25,23,0.82);
    padding: 9px 15px 11px;
    border-radius: 5px;
    border-top: 2px solid #CA8A04;
    text-align: right;
  }
  .url-label {
    font-family: 'SourceSans', system-ui, sans-serif;
    font-size: 8.5px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: rgba(250,250,247,0.28);
    margin-bottom: 3px;
  }
  .url-text {
    font-family: 'Fraunces', Georgia, serif;
    font-size: 30px;
    font-weight: 700;
    color: #F0EDE6;
    letter-spacing: -0.5px;
    line-height: 1;
  }
  .url-text em { font-style: normal; color: #9A3412; }

  .spec {
    position: absolute; bottom: 14px; left: 80px;
    font-family: 'SourceSans', system-ui, sans-serif;
    font-size: 9px; color: rgba(250,250,247,0.08); letter-spacing: 0.06em; z-index: 9;
  }
</style>
</head>
<body>
<div class="banner">

  <div class="left-bg">
    <img src="sl-watercolor-bg-16x9.png" alt="" />
  </div>
  <div class="bar-top"></div>
  <div class="bar-bottom"></div>

  <!-- Bento collage — face-forward, 4-col × 2-row -->
  <div class="collage">
    <!-- Big hero — Jean Ellison — spans both rows -->
    <div class="cc c-big">
      <img src="../images/profiles/jean-ellison/jean-ellison-brand-fistpump.jpg" alt="Jean Ellison" style="object-position:65% 10%;" />
      <!-- Dark overlay on left edge where SOUTHERN LEGENDS text hangs over -->
      <div style="position:absolute;inset:0;background:linear-gradient(to right, rgba(10,6,4,0.72) 0%, rgba(10,6,4,0.35) 38%, transparent 65%);pointer-events:none;"></div>
    </div>
    <!-- Row 1 small cells -->
    <div class="cc c-jean">
      <img src="../images/essays/rbwf-hero-face.jpg" alt="Michele — Redbird Willow Farm" style="object-position:center 18%;" />
    </div>
    <div class="cc c-shan">
      <img src="../images/profiles/shannon-jenkins/shannon-jenkins-headshot-v4.webp" alt="Shannon Jenkins" style="object-position:center 8%;" />
    </div>
    <!-- Freedom Riders mugshots — top right -->
    <div class="cc c-sam">
      <img src="dennis-closeup-banner.png" alt="David Dennis — Freedom Rider mugshot 1961" style="object-position:center center;" />
    </div>
    <!-- Row 2 small cells -->
    <div class="cc c-lewis">
      <img src="../images/profiles/jay-jenkins/jay-market-ciara.webp" alt="Jay Jenkins and Ciara Smith" style="object-fit:cover; object-position:center 20%; transform:scale(1.2); transform-origin:50% 15%;" />
    </div>
    <!-- Samuel — bottom right -->
    <div class="cc c-bus">
      <img src="sam-closeup-banner.png" alt="Samuel — AQuality Farms" style="object-position:center top;" />
    </div>
    <!-- CLT snow trail -->
    <div class="cc c-wood">
      <img src="../images/journal/chief-ladiga-trail-snow-2017.webp" alt="Chief Ladiga Trail in snow" style="object-position:center 30%;" />
    </div>
  </div>

  <!-- Text -->
  <div class="content">
    <div>
      <div class="eyebrow">Appalachian Foothills of Northeast Alabama</div>
      <span class="wm">Southern</span>
      <span class="wm">Legends</span>
    </div>
  </div>

  <div class="url-block">
    <div class="url-label">Shop the full catalog</div>
    <div class="url-text">southern<em>legends</em>.org</div>
  </div>

  <!-- SL crimson square mark — top-left -->
  <div style="position:absolute; top:20px; left:28px; z-index:8;
    width:58px; height:58px; background:#9B1C1C; border-radius:6px;
    display:flex; align-items:center; justify-content:center;">
    <span style="font-family:'Fraunces',Georgia,serif; font-weight:700; font-size:22px;
      color:#FAFAF7; letter-spacing:-1px; line-height:1;">SL</span>
  </div>

  <!-- Matt hedcut signature — bottom left of watercolor zone -->
  <div style="position:absolute; bottom:22px; left:28px; z-index:9;
    display:flex; align-items:center; gap:20px; opacity:0.85;">
    <img src="../images/about/headshot-hedcut-matt-headley.webp"
      style="width:57px; height:57px; border-radius:50%; object-fit:cover; filter:grayscale(20%);" />
    <span style="font-family:'SourceSans',system-ui,sans-serif; font-size:15px;
      letter-spacing:0.18em; text-transform:uppercase; color:#F0EDE6; line-height:1.4;">
      Matt Headley<br>
      <span style="color:#CA8A04; letter-spacing:0.22em; font-size:14px;">southernlegends.org</span>
    </span>
  </div>

  <div class="spec">8′ × 3′ · vinyl · evergreen</div>

</div>
</body>
</html>
