<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Southern Legends — Booth Banner 8′ × 2.5′ (Evergreen)</title>
<style>
  @font-face {
    font-family: 'Fraunces';
    src: url('../../src/app/fonts/Fraunces-SemiBold.ttf') format('truetype');
    font-weight: 700;
  }
  @font-face {
    font-family: 'SourceSans';
    src: url('../../src/app/fonts/SourceSans3-Regular.ttf') format('truetype');
    font-weight: 400;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 600px; overflow: hidden; }

  .banner {
    position: relative;
    width: 1920px;
    height: 600px;
    background: #1C1917;
    overflow: hidden;
  }

  /* Left gradient zone — hard stop at 920px */
  .left-bg {
    position: absolute;
    top: 0; left: 0;
    width: 920px;
    height: 100%;
    background: linear-gradient(115deg, #3D6B4F 0%, #9A3412 100%);
    z-index: 0;
  }
  .topo {
    position: absolute;
    top: 0; left: 0;
    width: 920px;
    height: 100%;
    background-image: url('../topo-7.png');
    background-repeat: repeat;
    background-size: 420px auto;
    opacity: 0.11;
    z-index: 1;
  }

  /* Gold bars — full width */
  .bar-top    { position: absolute; top: 0;    left: 0; right: 0; height: 7px; background: #CA8A04; z-index: 20; }
  .bar-bottom { position: absolute; bottom: 0; left: 0; right: 0; height: 7px; background: #CA8A04; z-index: 20; }

  /* ─── BENTO COLLAGE ─── */
  /* 4-col × 2-row grid, right 1000px. Face-first crop on every cell. */
  .collage {
    position: absolute;
    right: 0; top: 0;
    width: 1000px;
    height: 100%;
    z-index: 2;
    display: grid;
    gap: 4px;
    grid-template-columns: 2fr 1fr 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    grid-template-areas:
      "big  jean  shan  sam"
      "big  lewis wood  sam";
    overflow: hidden;
    background: #111;
  }
  .cc {
    position: relative;
    overflow: hidden;
  }
  .cc img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 15%; /* bias toward faces */
    display: block;
  }

  /* Named grid placements */
  .c-big   { grid-area: big; }
  .c-jean  { grid-area: jean; }
  .c-shan  { grid-area: shan; }
  .c-sam   { grid-area: sam; }
  .c-lewis { grid-area: lewis; }
  .c-wood  {
    grid-area: wood;
    background: #0c0c0c;
    display: flex; align-items: center; justify-content: center;
  }
  .c-wood img {
    width: 80%; height: 80%;
    object-fit: contain;
    object-position: center;
  }

  /* Subtle dark vignette on each face cell — deepens toward edges */
  .cc::after {
    content: '';
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at 50% 30%, transparent 40%, rgba(28,25,23,0.45) 100%);
    pointer-events: none;
  }
  .c-wood::after { display: none; }

  /* Gold seam at left edge of collage */
  .collage::before {
    content: '';
    position: absolute; top: 0; left: 0;
    width: 2px; height: 100%;
    background: #CA8A04;
    z-index: 10;
  }

  /* ─── TEXT ─── */
  .content {
    position: absolute;
    top: 0; left: 0;
    width: 920px;
    height: 100%;
    z-index: 5;
    display: flex;
    align-items: center;
    padding: 60px 80px;
  }

  .eyebrow {
    font-family: 'SourceSans', system-ui, sans-serif;
    font-size: 13px;
    letter-spacing: 0.34em;
    text-transform: uppercase;
    color: #CA8A04;
    margin-bottom: 18px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .eyebrow::before {
    content: '';
    width: 20px; height: 2px;
    background: #CA8A04;
    flex-shrink: 0;
  }

  .wm {
    display: block;
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 700;
    font-size: 178px;
    line-height: 0.86;
    text-transform: uppercase;
    letter-spacing: -5px;
    color: #9B1C1C;
  }

  .tagline {
    font-family: 'SourceSans', system-ui, sans-serif;
    font-size: 15px;
    color: rgba(240,237,230,0.44);
    letter-spacing: 0.24em;
    text-transform: uppercase;
    margin-top: 24px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .dot { width: 3px; height: 3px; border-radius: 50%; background: #CA8A04; flex-shrink: 0; }

  /* URL chip — bottom-right of collage */
  .url-block {
    position: absolute;
    right: 18px; bottom: 18px;
    z-index: 15;
    background: rgba(28,25,23,0.82);
    padding: 9px 15px 11px;
    border-radius: 5px;
    border-top: 2px solid #CA8A04;
    text-align: right;
  }
  .url-label {
    font-family: 'SourceSans', system-ui, sans-serif;
    font-size: 8.5px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: rgba(250,250,247,0.28);
    margin-bottom: 3px;
  }
  .url-text {
    font-family: 'Fraunces', Georgia, serif;
    font-size: 30px;
    font-weight: 700;
    color: #F0EDE6;
    letter-spacing: -0.5px;
    line-height: 1;
  }
  .url-text em { font-style: normal; color: #9A3412; }

  .spec {
    position: absolute; bottom: 14px; left: 80px;
    font-family: 'SourceSans', system-ui, sans-serif;
    font-size: 9px; color: rgba(250,250,247,0.08); letter-spacing: 0.06em; z-index: 9;
  }
</style>
</head>
<body>
<div class="banner">

  <div class="left-bg"></div>
  <div class="topo"></div>
  <div class="bar-top"></div>
  <div class="bar-bottom"></div>

  <!-- Bento collage — face-forward, 4-col × 2-row -->
  <div class="collage">
    <!-- Big hero — Michele, RBWF — spans both rows -->
    <div class="cc c-big">
      <img src="../images/essays/rbwf-hero-face.jpg" alt="Michele — Redbird Willow Farm" style="object-position:center 18%;" />
    </div>
    <!-- Row 1 small cells -->
    <div class="cc c-jean">
      <img src="../images/profiles/jean-ellison/jean-ellison-brand-fistpump.jpg" alt="Jean Ellison" style="object-position:center 10%;" />
    </div>
    <div class="cc c-shan">
      <img src="../images/profiles/shannon-jenkins/shannon-jenkins-headshot-v4.webp" alt="Shannon Jenkins" style="object-position:center 8%;" />
    </div>
    <!-- Samuel spans both rows on far right -->
    <div class="cc c-sam">
      <img src="../images/profiles/aquality-farms/sam-farmers-market-cropped.webp" alt="Samuel — AQuality Farms" style="object-position:center 12%;" />
    </div>
    <!-- Row 2 small cells -->
    <div class="cc c-lewis">
      <img src="../images/profiles/lewis-downing/lewis-at-counter.webp" alt="Lewis Downing" style="object-position:20% 10%;" />
    </div>
    <!-- Pilgrims photo -->
    <div class="cc c-wood" style="background:#0e1710;">
      <img src="../images/profiles/ecclesia-community/pilgrims-forest.webp" alt="Pilgrims in the forest" style="object-fit:cover; width:100%; height:100%; object-position:center center; filter:none; opacity:1;" />
    </div>
  </div>

  <!-- Text -->
  <div class="content">
    <div>
      <div class="eyebrow">Northeast Alabama</div>
      <span class="wm">Southern</span>
      <span class="wm">Legends</span>
      <div class="tagline">
        Shirts <span class="dot"></span>
        Stickers <span class="dot"></span>
        Stories
      </div>
    </div>
  </div>

  <div class="url-block">
    <div class="url-label">Shop the full catalog</div>
    <div class="url-text">southern<em>legends</em>.org</div>
  </div>

  <!-- SL crimson mark — top-left, anchored on text side -->
  <img src="../images/sl-mark-crimson.svg"
    alt="Southern Legends mark"
    style="position:absolute; top:22px; left:30px; width:54px; height:54px; z-index:8; opacity:0.92;" />

  <div class="spec">8′ × 2.5′ · vinyl · evergreen</div>

</div>
</body>
</html>
