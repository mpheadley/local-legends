<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Southern Legends — Booth Banner 8′ × 2.5′ (Evergreen)</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,700;0,9..144,900;1,9..144,400&family=DM+Sans:wght@400;500;700&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 1920px;
    height: 600px;
    overflow: hidden;
    background: #0c0808;
  }

  .banner {
    position: relative;
    width: 1920px;
    height: 600px;
    background: #0c0808;
    overflow: hidden;
    display: flex;
    align-items: center;
  }

  /* Topo texture */
  .topo {
    position: absolute;
    inset: 0;
    background-image: url('../topo-7.png');
    background-repeat: repeat;
    background-size: 480px auto;
    opacity: 0.07;
    z-index: 0;
  }

  /* Crimson bars */
  .bar-top {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 10px;
    background: linear-gradient(90deg, #8b1a1a 0%, #C8102E 50%, #8b1a1a 100%);
    z-index: 10;
  }
  .bar-bottom {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 10px;
    background: linear-gradient(90deg, #8b1a1a 0%, #C8102E 50%, #8b1a1a 100%);
    z-index: 10;
  }

  /* Pilgrims figure — ghost in the center-right */
  .pilgrims-wrap {
    position: absolute;
    right: 0;
    bottom: 0;
    height: 100%;
    width: 800px;
    z-index: 1;
    overflow: hidden;
  }
  .pilgrims-wrap img {
    height: 100%;
    width: auto;
    object-fit: contain;
    object-position: bottom right;
    opacity: 0.09;
    filter: invert(1);
    transform: translateX(80px);
  }

  /* Decorative horizontal rules */
  .rule {
    position: absolute;
    left: 0; right: 0;
    height: 1px;
    background: rgba(139,26,26,0.18);
    z-index: 1;
  }
  .rule-top    { top: 80px; }
  .rule-bottom { bottom: 80px; }

  /* Decorative vertical rule — center divider */
  .v-rule {
    position: absolute;
    top: 80px; bottom: 80px;
    width: 1px;
    background: rgba(139,26,26,0.3);
    z-index: 3;
    left: 1100px;
  }

  /* Left glow */
  .glow {
    position: absolute;
    left: -200px; top: 50%;
    transform: translateY(-50%);
    width: 700px; height: 700px;
    background: radial-gradient(ellipse, rgba(139,26,26,0.12) 0%, transparent 70%);
    z-index: 0;
  }

  /* Main layout */
  .content {
    position: relative;
    z-index: 5;
    display: flex;
    align-items: center;
    width: 100%;
    height: 100%;
    padding: 60px 80px;
  }

  /* ── LEFT BLOCK ── */
  .left {
    flex: 1;
    padding-right: 60px;
  }

  .eyebrow {
    font-family: 'DM Sans', sans-serif;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: #C8102E;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .eyebrow::before {
    content: '';
    display: inline-block;
    width: 28px;
    height: 2px;
    background: #C8102E;
    flex-shrink: 0;
  }

  .headline {
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 900;
    line-height: 0.88;
    color: #FAFAF7;
    text-transform: uppercase;
    letter-spacing: -5px;
  }
  .hl-southern {
    font-size: 192px;
    display: block;
    color: #FAFAF7;
  }
  .hl-legends {
    font-size: 192px;
    display: block;
    color: #C8102E;
    -webkit-text-stroke: 0px transparent;
  }

  .tagline {
    font-family: 'DM Sans', sans-serif;
    font-size: 19px;
    color: rgba(250,250,247,0.35);
    letter-spacing: 0.18em;
    text-transform: uppercase;
    margin-top: 28px;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .tagline-dot {
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: #8b1a1a;
    flex-shrink: 0;
  }

  /* ── RIGHT BLOCK ── */
  .right {
    width: 660px;
    flex-shrink: 0;
    padding-left: 80px;
  }

  .right-label {
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: rgba(250,250,247,0.25);
    margin-bottom: 18px;
  }

  .right-url {
    font-family: 'Fraunces', Georgia, serif;
    font-size: 52px;
    font-weight: 700;
    color: #FAFAF7;
    letter-spacing: -1px;
    margin-bottom: 36px;
    line-height: 1;
  }
  .right-url span {
    color: #C8102E;
  }

  .right-items {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .right-items li {
    font-family: 'DM Sans', sans-serif;
    font-size: 20px;
    color: rgba(250,250,247,0.45);
    display: flex;
    align-items: center;
    gap: 14px;
    line-height: 1.4;
  }
  .right-items li .dash {
    width: 22px;
    height: 2px;
    background: #8b1a1a;
    flex-shrink: 0;
  }

  /* SL mark — bottom right corner */
  .sl-mark {
    position: absolute;
    bottom: 28px;
    right: 36px;
    z-index: 6;
    display: flex;
    align-items: center;
    gap: 10px;
    opacity: 0.35;
  }
  .sl-box {
    width: 36px;
    height: 36px;
    border-radius: 4px;
    background: #9B1C1C;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Fraunces', Georgia, serif;
    font-size: 14px;
    font-weight: 900;
    color: #FAFAF7;
    letter-spacing: -1px;
  }
  .sl-text {
    font-family: 'DM Sans', sans-serif;
    font-size: 10px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: rgba(250,250,247,0.6);
    font-weight: 700;
  }

  /* Print spec bar — top right (visible in HTML preview only) */
  .spec-bar {
    position: absolute;
    top: 18px;
    right: 20px;
    font-family: 'DM Sans', monospace, sans-serif;
    font-size: 10px;
    color: rgba(250,250,247,0.15);
    letter-spacing: 0.06em;
    z-index: 20;
  }
</style>
</head>
<body>
<div class="banner">

  <div class="topo"></div>
  <div class="bar-top"></div>
  <div class="bar-bottom"></div>
  <div class="rule rule-top"></div>
  <div class="rule rule-bottom"></div>
  <div class="v-rule"></div>
  <div class="glow"></div>

  <!-- Ghost pilgrims figure -->
  <div class="pilgrims-wrap">
    <img src="./ECCLESIA-05-pilgrims-BLACK.png" alt="" />
  </div>

  <!-- Main content -->
  <div class="content">

    <!-- LEFT — Brand name -->
    <div class="left">
      <div class="eyebrow">Northeast Alabama</div>
      <div class="headline">
        <span class="hl-southern">Southern</span>
        <span class="hl-legends">Legends</span>
      </div>
      <div class="tagline">
        Shirts
        <span class="tagline-dot"></span>
        Stickers
        <span class="tagline-dot"></span>
        Stories
      </div>
    </div>

    <!-- RIGHT — URL + offerings -->
    <div class="right">
      <div class="right-label">Shop the full catalog</div>
      <div class="right-url">
        southern<span>legends</span>.org
      </div>
      <ul class="right-items">
        <li><span class="dash"></span> Local designs · printed in Alabama</li>
        <li><span class="dash"></span> More sizes &amp; designs available online</li>
        <li><span class="dash"></span> Custom orders welcome</li>
      </ul>
    </div>

  </div><!-- /content -->

  <!-- SL mark -->
  <div class="sl-mark">
    <div class="sl-box">SL</div>
    <div class="sl-text">Southern Legends</div>
  </div>

  <!-- Print spec (visible in preview) -->
  <div class="spec-bar">8′ × 2.5′ · 150 DPI · vinyl banner · evergreen</div>

</div>
</body>
</html>
